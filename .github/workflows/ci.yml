name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar links Markdown del repo
        run: python scripts/check_markdown_links.py
      - name: Tests del validador de links
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1
          pytest -q tests/test_check_markdown_links.py tests/test_sync_outline_docs.py

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias API
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test FastAPI
        run: python -c "from apps.api.app.main import app; print(app.title)"

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias web
        run: npm install
      - name: Build frontend
        run: npm run build:web
