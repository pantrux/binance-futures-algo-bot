services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../:/app
    command: bash -lc "pip install -r requirements.txt && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ../../:/app
    command: bash -lc "npm install && npm --workspace apps/web run dev"
    ports:
      - "3000:3000"
